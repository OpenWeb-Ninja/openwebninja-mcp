name: tag-latest
run-name: "Tag build #${{ github.event.workflow_run.run_number }} as latest"

# After a successful `publish` run on main, points
#   ghcr.io/romka-labs/openwebninja-mcp:latest  ->  :<that run's build number>
# Nothing is rebuilt: :latest is exactly the image that `publish` pushed.

on:
  workflow_run:
    workflows: [ "publish" ]     # must match `name:` of publish.yml
    types: [ completed ]
    branches: [ "main" ]

permissions:
  contents: read
  packages: write                # needed to move the :latest tag

concurrency:
  group: tag-latest
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/romka-labs/openwebninja-mcp
  BUILD: ${{ github.event.workflow_run.run_number }}

jobs:
  tag-latest:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag build as latest
        run: |
          docker buildx imagetools inspect "$IMAGE:$BUILD"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$BUILD"

      - name: Summary
        run: |
          {
            echo "### Tagged build $BUILD as latest"
            echo ""
            echo "\`${IMAGE}:latest\` now points to \`${IMAGE}:${BUILD}\`"
            echo ""
            echo "Commit \`${{ github.event.workflow_run.head_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
