name: publish

# Builds the Docker image on every push to any branch and pushes it to GHCR as
#   ghcr.io/romka-labs/openwebninja-mcp:<build number>   (unique, never reused)
#   ghcr.io/romka-labs/openwebninja-mcp:<branch name>    (moves to the newest build of that branch)
# It never touches :latest. On main, the `tag-latest` workflow does that after this run succeeds.

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write                # needed to push to ghcr.io

env:
  IMAGE: ghcr.io/romka-labs/openwebninja-mcp

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.run_number }}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Build ${{ github.run_number }}"
            echo ""
            echo "Image: \`${IMAGE}:${{ github.run_number }}\`"
            echo ""
            echo "Branch \`${{ github.ref_name }}\`, commit \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
